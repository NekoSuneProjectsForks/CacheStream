# =========================================================
# CacheStream desktop build + release
# =========================================================
# Builds the native (Electron) desktop app for Linux + Windows,
# x64 + arm64, and attaches the installers to the GitHub Release
# created for the tag.
#
# Each arch builds on a NATIVE runner. This matters because:
#   - ffmpeg-static ships a per-host binary (no win-arm64 build —
#     we vendor one for that target, see the step below), and
#   - better-sqlite3 in the bundled web panel is rebuilt against
#     Electron's ABI for the target arch, which is far simpler
#     native than cross-compiled.
#
# Triggers: tag push `v*`/numeric, a push to the `desktop` branch (CI
# builds for desktop-only work), or manual dispatch. A tag/dispatch with
# a version uploads installers to that GitHub Release; a `desktop`-branch
# push just produces downloadable workflow artifacts.
# =========================================================
name: desktop

on:
  push:
    branches:
      - desktop
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag to upload installers to, for example 1.14.0 or v1.14.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Pre-create the GitHub Release ONCE so the parallel matrix builds don't all
  # race to create it (electron-builder's `--publish always` otherwise has each
  # arch POST /releases, and the losers get HTTP 422 already_exists — which is
  # what failed the linux-arm64 publish). With the release pre-created, every
  # build just uploads its assets to it. The job always runs (so the matrix
  # `needs` it on branch builds too); the step is a no-op off a tag/dispatch.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the GitHub Release exists
        if: github.ref_type == 'tag' || github.event.inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="$GITHUB_REF_NAME"
          BARE="${VERSION#v}"
          for TAG in "$VERSION" "v${BARE}" "${BARE}"; do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG already exists"; exit 0
            fi
          done
          awk -v v="$BARE" '$0 ~ "^## "v"($| )" {p=1;next} p && /^## [0-9]/ {exit} p {print}' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "See the changelog for details." > notes.md
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$BARE" --notes-file notes.md

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,    flags: "--linux --x64" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, flags: "--linux --arm64" }
          - { name: win-x64,     os: windows-latest,   flags: "--win --x64" }
          - { name: win-arm64,   os: windows-11-arm,   flags: "--win --arm64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # AppImage tooling + package helpers on the Linux runners.
      - name: Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot rpm

      # electron-builder's bundled fpm is linux-x86 only. The ARM64
      # runner must use a native Ruby-installed fpm for .deb packaging.
      - name: Linux arm64 fpm deps
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          fpm --version
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      # ffmpeg-static has no win32-arm64 binary — vendor one so the
      # builder copies it into resources/ffmpeg for that target.
      - name: Vendor win-arm64 ffmpeg
        if: matrix.name == 'win-arm64'
        shell: pwsh
        run: |
          $dst = "apps/desktop/build/ffmpeg/win32-arm64"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $zip = "$env:RUNNER_TEMP\ff.zip"
          # BtbN publishes win-arm64 ffmpeg builds.
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ff" -Force
          Copy-Item (Get-ChildItem -Recurse "$env:RUNNER_TEMP\ff\*\bin\ffmpeg.exe").FullName -Destination "$dst\ffmpeg.exe"

      # Publish on a tag (or a dispatch with a version); otherwise just
      # build. `--publish always` makes electron-builder upload the
      # installers AND the update metadata (latest.yml / latest-linux.yml
      # + .blockmap) the in-app auto-updater reads. GH_TOKEN authorises
      # the upload to the GitHub Release.
      - id: pub
        name: Compute publish mode
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$DISPATCH_VERSION" || "${{ github.ref_type }}" == "tag" ]]; then
            echo "mode=always" >> "$GITHUB_OUTPUT"
          else
            echo "mode=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.name }}
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- ${{ matrix.flags }} --publish ${{ steps.pub.outputs.mode }}

      # Put this version's CHANGELOG section into the GitHub Release body
      # so the in-app updater can render it as the "what's new" notes.
      # Runs once (linux-x64) after electron-builder created the release.
      - name: Set release notes from CHANGELOG
        if: steps.pub.outputs.mode == 'always' && matrix.name == 'linux-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [[ -z "$VERSION" ]] && VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v"($| )" {p=1;next} p && /^## [0-9]/ {exit} p {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "See the changelog for details." > "$RUNNER_TEMP/notes.md"
          gh release edit "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release edit "${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" \
            || echo "Could not set release notes (release not found yet)."

      # Branch / non-release builds: expose installers + update metadata
      # as downloadable workflow artifacts (electron-builder didn't
      # publish them to a Release).
      - name: Upload installers as workflow artifacts
        if: steps.pub.outputs.mode != 'always'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.yml
          if-no-files-found: ignore

  # electron-builder uploads .blockmap files (used for differential auto-
  # updates) alongside the installers. We don't want them on the Release —
  # the updater falls back to a full download without them. This runs once,
  # after every arch has published, and strips every .blockmap asset.
  strip-blockmaps:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete .blockmap assets from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="$GITHUB_REF_NAME"
          BARE="${VERSION#v}"
          for TAG in "$VERSION" "v${BARE}" "${BARE}"; do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
                -q '.assets[].name | select(endswith(".blockmap"))' \
                | while read -r A; do
                    [ -z "$A" ] && continue
                    echo "deleting $A from $TAG"
                    gh release delete-asset "$TAG" "$A" -R "$GITHUB_REPOSITORY" --yes || true
                  done
              break
            fi
          done
