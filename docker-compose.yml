services:
  # ---------------------------------------------------------
  # Next.js control panel + scene host (port 7788 → Cloudflare
  # Tunnel). Stateless except for the shared data + audio
  # volumes.
  # ---------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: cachestream-web:latest
    container_name: cachestream-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-7788}
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-7788}:${WEB_PORT:-7788}"
    volumes:
      - cachestream-data:/app/data           # SQLite DB + cover art
      - ./media/music:/app/media/music       # music library (read-write for uploads)
      - ./media/vods:/app/media/vods         # VOD video files (read-write for uploads)
      - cachestream-audio:/app/audio         # FIFO shared with streamer
    depends_on:
      - streamer
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${WEB_PORT:-7788}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------
  # Headless Chromium + FFmpeg worker. Internal-only; not
  # published to the host. Reachable as http://streamer:7789
  # from the web container over the compose network.
  # ---------------------------------------------------------
  streamer:
    build:
      context: ./apps/streamer
      dockerfile: Dockerfile
    image: cachestream-streamer:latest
    container_name: cachestream-streamer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STREAMER_PORT: 7789
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      # Audio FIFOs shared with the web container. Two pipes:
      #   - silence.fifo: always-on carrier (silent PCM)
      #   - music.fifo:   real music when a track is playing
      # The streamer amix-es both into the broadcast audio track.
      SILENCE_FIFO_PATH: /app/audio/silence.fifo
      MUSIC_FIFO_PATH:   /app/audio/music.fifo
    shm_size: "1gb"
    expose:
      - "7789"
    volumes:
      - cachestream-audio:/app/audio
      - ./media/vods:/app/media/vods:ro   # VODs to stream (read-only on this side)
    # On a Raspberry Pi, use `docker compose -f docker-compose.yml
    # -f docker-compose.pi.yml up -d` to pass /dev/video11 + GPU
    # access through so the h264_v4l2m2m hardware encoder works.
    # On non-Pi hosts you don't need any of that.
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7789/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cachestream-data:
  cachestream-audio:
