# =========================================================
# Raspberry Pi overlay — adds the kernel video devices the
# streamer needs to use the on-board h264_v4l2m2m hardware
# encoder.
#
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
#
# Or persist via shell:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.pi.yml
#   docker compose up -d
#
# ─────────────────────────────────────────────────────────
# Before using this file, check what video devices your Pi
# actually exposes:
#
#     ls /dev/video*
#
# On modern Raspberry Pi OS (Bookworm / 64-bit, Pi 4):
#     /dev/video10  → decoder
#     /dev/video11  → H.264 encoder    ← this is the one we want
#     /dev/video12  → ISP
#
# On Bullseye and earlier the encoder may be at /dev/video1.
# On Raspberry Pi 5 there is NO hardware H.264 encoder — the
# v4l2m2m codec stack was dropped in favour of the new ISP
# unit which is not exposed via v4l2. Pi 5 users should run
# WITHOUT this overlay; the streamer's runtime fallback will
# pick libx264 automatically.
#
# If you see an error like:
#   "error gathering device information while adding custom
#    device /dev/video10: no such file or directory"
# …it means that device doesn't exist on your Pi. Either:
#   (a) load the kernel module (Bookworm/Pi 4):
#       echo 'dtoverlay=rpivid-v4l2' | sudo tee -a /boot/firmware/config.txt
#       sudo reboot
#   (b) edit the `devices:` block below to match your /dev/video*
#   (c) just don't use this overlay — the runtime fallback in
#       v1.6 detects HW encoder failure and switches to libx264
#       automatically. Performance is fine on a Pi 4 at 720p30
#       ultrafast.
# ─────────────────────────────────────────────────────────
services:
  streamer:
    devices:
      # Encoder. If your Pi OS has it at a different path,
      # adjust the LEFT side of the colon (host) only.
      - /dev/video11:/dev/video11
      # Decoder + ISP — useful for future HW decode / filter
      # work. Comment these out if your Pi only has video11.
      - /dev/video10:/dev/video10
      - /dev/video12:/dev/video12
    # Some Pi OS installs gate the video devices behind the
    # `video` group rather than world-rw. Adding the streamer
    # user to it (entrypoint runs as root briefly, so this
    # supplementary group survives the setpriv drop) covers
    # both layouts.
    group_add:
      - video
