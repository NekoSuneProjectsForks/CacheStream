# =========================================================
# CacheStream — RTMP ingest + HLS unwrap
# =========================================================
# Listens on 1935 for OBS pushes. Wraps the incoming RTMP into
# HLS chunks that the headless Chromium scene plays back via a
# <video> element. The streamer's main FFmpeg captures the
# rendered page as usual, so chat overlays + games still
# composite on top of the OBS feed.
#
# Trade-off note: this path adds ~2-3s of latency end-to-end
# (RTMP → HLS segments → Chromium decode → screencast → FFmpeg
# → Twitch). For OBS-as-camera workflows that's fine. If you
# need lower latency, the streamer's RTMP-passthrough mode in
# /api/ingest/passthrough is a future option.
# =========================================================

worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Convert incoming RTMP to HLS so the browser can play it
            # without needing a Flash/RTMP plugin. 2s fragments give
            # a sane balance between latency and segment overhead.
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;

            # Allow access from the docker-compose network only.
            # The host port (1935) is the public ingest; HTTP/HLS
            # below is internal-only.
            allow publish all;
            allow play 127.0.0.1;
            allow play 172.16.0.0/12;
            allow play 10.0.0.0/8;
            allow play 192.168.0.0/16;
            deny play all;
        }
    }
}

http {
    # Tiny HLS server for the headless Chromium scene to pull from.
    server {
        listen 8080;
        server_name _;

        # CORS so the /scene/ingest page can fetch the playlist
        # cross-origin (it lives on the web container's port).
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;

        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /tmp;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
