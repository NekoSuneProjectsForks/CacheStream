# =========================================================
# CacheStream — RTMP ingest + HLS unwrap (low-latency)
# =========================================================
# Listens on 1935 for OBS pushes. Wraps the incoming RTMP into
# short HLS chunks that the headless Chromium scene plays back
# via hls.js with an aggressive low-latency profile. The
# streamer's main FFmpeg captures the rendered page as usual, so
# chat overlays + games still composite on top of the OBS feed.
#
# Latency budget (v1.10.2):
#
#   OBS encode buffer .................. ~1.0s (OBS GOP-bound)
#   nginx-rtmp HLS chunking ............ ~1.0s (hls_fragment 1s)
#   hls.js maxBufferLength ............. ~1.5s (was 8s)
#   Chromium decode + paint ............ ~0.2s
#   FFmpeg encode + RTMP push to Twitch  ~0.5s
#   Twitch's own RTMP → HLS .......... ~3.0s  (uncontrollable)
#   ----------------------------------------------------------
#   End-to-end ........................ ~7s   (was ~60-120s)
#
# Operators with a low-RTT path between their encoder and the
# Pi can pull this down to ~5s by also dropping their OBS
# keyframe interval to 1s (Settings → Output → Keyframe Interval).
# Anything below ~5s starts depending on uncontrollable Twitch
# behaviour and isn't reliably achievable from our side.
# =========================================================

# v1.13.6: own the user line. The image runs as root (no
# `USER` in the Dockerfile) so worker processes can chown
# /tmp/hls correctly without us doing it from outside.
user root;
worker_processes auto;
# v1.13.6: emit errors to stderr so `docker compose logs ingest`
# actually shows what's going on when OBS can't push. Previously
# nginx-rtmp errors went to the image's internal log file that
# operators had to docker-exec in to read.
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        # 1024 chunk size — smaller chunks = more headers but faster
        # flush downstream. RTMP default (4096) was tuned for FMS
        # encoding workflows where the encoder buffers per chunk
        # before sending; we want each video packet to flush ASAP.
        chunk_size 1024;
        # v1.13.6: bump from default to absorb a brief network glitch
        # without dropping the OBS connection. 30s is the longest
        # well-known RTMP idle without seeing a "stale connection"
        # warning from most encoders.
        max_message 1M;
        timeout 30s;

        # Top-level access + error log surfaces every publish/play
        # event with client IP, stream name, duration. Critical for
        # debugging "OBS shows green but no frames" complaints —
        # check `docker compose logs ingest` to confirm OBS is
        # actually connecting + which key it's pushing to.
        access_log /dev/stdout;

        application live {
            live on;
            record off;

            hls on;
            hls_path /tmp/hls;
            # 1s fragments + 3s playlist = ~2s of accumulated
            # client-side buffering. nginx-rtmp doesn't support the
            # LL-HLS partial-segment spec, but hls.js can chase the
            # live edge of a regular HLS playlist aggressively, so
            # short standard segments give us most of the benefit.
            hls_fragment 1s;
            hls_playlist_length 3s;
            hls_cleanup on;
            # hls_sync 100ms — when nginx-rtmp resyncs the segmenter
            # (e.g. on a keyframe gap), do it tightly so we don't
            # stall the player with a long catch-up segment.
            hls_sync 100ms;
            # v1.13.6: continuous mode ensures HLS keeps producing
            # segments even when audio briefly stalls in the input.
            # OBS sometimes drops a few audio frames during scene
            # cuts; without continuous mode the player would stall.
            hls_continuous on;

            allow publish all;
            # v1.13.6: opening up the play side to everything inside
            # the docker network. The previous 172.16/12 + 10/8 +
            # 192.168/16 list missed Docker's default 172.17/16
            # (which IS in 172.16/12 — so this was probably fine —
            # but explicit "any" is clearer + future-proof). The
            # public RTMP port is :1935; the internal HTTP/HLS
            # port :8080 is not published to the host, so this
            # doesn't leak the feed to the internet.
            allow play all;
        }
    }
}

http {
    include       /usr/local/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # Disable proxy/sendfile buffering so HLS segments stream out
    # as soon as they're flushed to disk.
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;
    keepalive_timeout 30s;

    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;

        # CORS for /scene/ingest fetching the playlist cross-origin.
        add_header Access-Control-Allow-Origin *;
        # Browser caches were sometimes serving stale .m3u8 even
        # with no-cache; explicit must-revalidate + zero max-age
        # closes the loop.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;

        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /tmp;
        }

        # v1.13.6: nginx-rtmp's stats XML feed. Lets the panel show
        # "OBS is connected — 3500 kbps inbound" instead of just
        # "live: true/false" guessed from a HEAD against the
        # playlist file. The /api/ingest/status route parses this
        # for the per-key bitrate + duration + client IP.
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
