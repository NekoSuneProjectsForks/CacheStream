# Branding is resolved from the repo at build time by scripts/eb.mjs
# (run via `npm run dist`/`dist:win`/`dist:linux`/`pack:dir`), which sets
# these env vars and writes src/app-name.json for the runtime title.
# Rename the repo → installers, appId, publish target and title all
# follow automatically (defaults to CacheStream). Do NOT call
# electron-builder directly — go through the npm scripts so the env is set.
appId: ${env.APP_ID}
productName: ${env.APP_NAME}
copyright: ${env.APP_COPYRIGHT}
directories:
  output: dist
  buildResources: build

# Where the in-app auto-updater (electron-updater) looks for new
# versions, and what `electron-builder --publish` uploads alongside the
# installers: the update metadata (latest.yml / latest-linux.yml) +
# .blockmap files. The updater reads the latest GitHub Release here.
publish:
  provider: github
  owner: ${env.GH_OWNER}
  repo: ${env.GH_REPO}
  releaseType: release

# What goes inside the app bundle (the asar). The Electron main
# process + its small dependency tree. The Next.js panel itself is
# NOT in here — it ships as an unpacked extraResource (below) so its
# native better-sqlite3 binary and the standalone server can be run
# as a child Node process.
files:
  - src/**/*
  - package.json
  - "!**/*.map"

# ffmpeg-static keeps a platform binary in node_modules; it must be
# OUTSIDE the asar to be spawnable. better-sqlite3 is not here (it
# lives in the unpacked web bundle) but unpack it too if it ever is.
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/better-sqlite3/**"

# The built Next.js standalone panel (produced by scripts/build-web.mjs
# into ./build/web) is copied verbatim into the app's resources dir.
# At runtime main.js launches build/web/server.js via utilityProcess.
# A per-arch vendored ffmpeg (build/ffmpeg/${platform}-${arch}) is
# copied when present — used for targets ffmpeg-static doesn't cover
# (notably win32 arm64).
extraResources:
  - from: build/web
    to: web
  - from: build/ffmpeg/${platform}-${arch}
    to: ffmpeg
    filter: ["**/*"]

linux:
  category: AudioVideo
  maintainer: CacheNetworks <noreply@github.com>
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

win:
  target:
    - nsis
    - portable
  # NSIS uses this name (<AppName>-x.y.z-win-x64.exe). The portable
  # target overrides its own name below — without that, BOTH produce
  # the same .exe filename, which collides and breaks publishing (you
  # end up with only the .blockmap uploaded, no installer + no latest.yml).
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
