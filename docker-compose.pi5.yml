# =========================================================
# Raspberry Pi 5 overlay
# =========================================================
# The Pi 5 (BCM2712) has NO fixed-function H.264 encoder, so — unlike
# the Pi 4 overlay — we do NOT map /dev/video10/11/12 (they don't exist
# on a Pi 5 and Docker would error: "no such file or directory"). The
# streamer auto-detects the Pi 5 and uses a tuned software libx264
# profile (720p30 veryfast).
#
# What this overlay DOES map is the GPU render node (/dev/dri). Without
# it, in-container Chromium falls back to the CPU software compositor,
# which can only repaint the animated scenes at ~3 fps — the choppy
# "3-fps slideshow" you see in the broadcast. With the GPU render node
# passed through, Chromium rasterises scenes on the V3D GPU and the
# screencast runs at the full frame rate.
#
# The streamer image already ships the Mesa GL/EGL drivers, and
# STREAM_CHROMIUM_GPU defaults to `auto` (which enables GPU on a Pi), so
# this device mapping is the only thing you need to add.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.pi5.yml up -d
#
# Or persist it for plain `docker compose` commands:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.pi5.yml
#   docker compose up -d
#
# If you get "error gathering device information ... /dev/dri: no such
# file or directory", your Pi OS isn't exposing the render node — make
# sure you're on a 64-bit Pi OS with the V3D driver (it's on by default
# on Bookworm). `ls /dev/dri` should show renderD128.
# =========================================================
services:
  streamer:
    devices:
      # GPU render node (VideoCore VII / V3D). Lifts Chromium scene
      # rendering off the ~3 fps software path. This is the whole fix.
      - /dev/dri:/dev/dri
    # The render node is gated behind the host's `render` group, so the
    # streamer's (non-root) process needs to be in that group.
    #
    # IMPORTANT: use the NUMERIC GID, not the name. Docker resolves a
    # group NAME against the CONTAINER's /etc/group — which has no
    # `render` group — so `group_add: [render]` errors with "group not
    # found". A numeric GID is added directly with no lookup, so it
    # always works. Find yours on the Pi host:
    #
    #     getent group render        # → render:x:993:   (993 = the GID)
    #     ls -l /dev/dri/renderD128  # shows the owning group
    #
    # Then put YOUR GID below (993 is the common Pi OS Bookworm value;
    # 44 is the usual `video` GID). If `getent group render` is empty,
    # use the group `ls -l` shows (often `video`) instead.
    group_add:
      - "993"   # render  ← change to your GID from `getent group render`
      - "44"    # video
