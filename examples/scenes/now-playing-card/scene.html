<!--
  Now-Playing Card — polls /api/music/now once a second and renders
  cover + title + artist. Designed as a transparent-background
  overlay; drop it on top of another scene as an iframe layer.
-->
<aside class="card card-empty" id="card">
  <div class="cover" id="cover" aria-hidden="true">♫</div>
  <div class="meta">
    <div class="now-tag">Now playing</div>
    <div class="title" id="title">—</div>
    <div class="artist" id="artist"></div>
  </div>
</aside>

<script>
  const POLL_MS = 1000;
  const $card   = document.getElementById("card");
  const $cover  = document.getElementById("cover");
  const $title  = document.getElementById("title");
  const $artist = document.getElementById("artist");

  let lastTrackId = null;

  async function poll() {
    try {
      const r = await fetch("/api/music/now", { cache: "no-store" });
      if (!r.ok) return;
      const data = await r.json();

      // Idle → hide the card.
      if (data.mode === "idle" || !data.nowPlaying) {
        $card.classList.add("card-empty");
        lastTrackId = null;
        return;
      }

      const np = data.nowPlaying;
      $card.classList.remove("card-empty");
      $title.textContent  = np.title  || (data.mode === "radio" ? "Radio stream" : "Untitled");
      $artist.textContent = np.artist || (data.mode === "radio" ? "Live broadcast" : "");

      // Only swap the cover image when the trackId changes — avoids
      // re-fetching the same image every second.
      if (np.trackId && np.trackId !== lastTrackId) {
        lastTrackId = np.trackId;
        $cover.innerHTML = "";
        const img = new Image();
        img.src = `/api/music/cover/${np.trackId}`;
        img.alt = "";
        img.onerror = () => {
          // No embedded art — fall back to the music glyph.
          $cover.innerHTML = "♫";
        };
        $cover.appendChild(img);
      }
    } catch {
      /* network hiccup; next tick will retry */
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
