<!--
  Countdown Poster — paste this into the HTML field of a
  Custom Scene → Raw HTML/CSS template.

  Edit:
    - <h1 class="title"> for the headline
    - <p class="subtitle"> for the second line
    - TARGET_AT (in the <script> at the bottom) for the deadline
-->
<main class="poster">
  <div class="grid"></div>
  <div class="scanlines"></div>

  <p class="eyebrow"><span class="dot"></span> Standby</p>
  <h1 class="title">YOUR PRODUCT</h1>
  <p class="subtitle">Launches in</p>

  <div class="countdown" aria-live="polite">
    <div><span id="d">00</span><em>days</em></div>
    <div><span id="h">00</span><em>hours</em></div>
    <div><span id="m">00</span><em>min</em></div>
    <div><span id="s">00</span><em>sec</em></div>
  </div>

  <p class="footer">cachestream · live in T-minus</p>
</main>

<script>
  // Change this to your actual launch moment (ISO 8601, UTC).
  const TARGET_AT = "2026-06-01T20:00:00Z";

  const target = new Date(TARGET_AT).getTime();
  const $d = document.getElementById("d");
  const $h = document.getElementById("h");
  const $m = document.getElementById("m");
  const $s = document.getElementById("s");
  const pad = (n) => String(n).padStart(2, "0");

  function tick() {
    const ms = Math.max(0, target - Date.now());
    if (ms === 0) {
      // Past the deadline. Replace digits with "LIVE NOW".
      document.querySelector(".countdown").innerHTML =
        '<div class="live">LIVE</div>';
      return;
    }
    const tot = Math.floor(ms / 1000);
    $d.textContent = pad(Math.floor(tot / 86400));
    $h.textContent = pad(Math.floor((tot % 86400) / 3600));
    $m.textContent = pad(Math.floor((tot % 3600) / 60));
    $s.textContent = pad(tot % 60);
  }
  tick();
  setInterval(tick, 1000);
</script>
